<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>커스텀 사진 퍼즐 게임 - v8</title>
        <style>
        :root {
            --bg-color: #e5e7eb;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text: #1f2937;
            --panel-bg: #ffffff;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh;
            touch-action: none;
            overflow: hidden;
        }

        #top-section {
            display: flex; flex-direction: column; width: 100%;
            background-color: var(--panel-bg);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .top-layout {
            display: flex;
            gap: 10px;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .left-controls {
            flex: 55;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .control-row > * {
            flex: 1;
            width: 100%;
        }

        .right-preview {
            flex: 45;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            background: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 4px; /* 8차 패치: 테두리 여백 추가 */
        }

        .preview-placeholder {
            color: #9ca3af;
            font-weight: 700;
            font-size: 14px;
        }

        /* 8차 패치: 원본 비율 유지 (contain) 및 절대위치 해제 */
        #preview-img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            display: none;
            border-radius: 8px;
        }

        #status-bar-wrapper {
            display: flex;
            justify-content: center;
            padding-bottom: 10px;
            width: 100%;
        }

        #status-bar {
            background: rgba(79, 70, 229, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600; color: var(--primary);
            display: none;
            font-variant-numeric: tabular-nums;
            font-size: 14px;
        }

        button, .file-upload-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 8px 4px; border: none; border-radius: 12px;
            background-color: var(--primary); color: white;
            cursor: pointer; transition: all 0.1s;
            box-shadow: 0 4px 0 var(--primary-hover);
            box-sizing: border-box; height: 100%;
        }
        button:active, .file-upload-btn:active { 
            transform: translateY(4px); box-shadow: 0 0 0 var(--primary-hover); 
        }
        .btn-icon { font-size: 24px; margin-bottom: 2px; pointer-events: none; }
        .btn-text { font-size: 12px; font-weight: 800; pointer-events: none; text-align: center; word-break: keep-all; line-height: 1.1; }
        
        select { 
            background-color: white; color: var(--text); border: 2px solid #d1d5db; 
            padding: 8px 4px; border-radius: 12px; font-size: 13px; font-weight: 700;
            width: 100%; box-sizing: border-box; outline: none; cursor: pointer;
            box-shadow: 0 4px 0 #e5e7eb; text-align: center;
        }
        input[type="file"] { display: none; }
        .file-upload-wrapper { display: block; flex: 1; }

        @media (max-width: 600px) {
            .btn-icon { font-size: 20px; }
            .btn-text { font-size: 11px; }
            button, .file-upload-btn { padding: 6px 2px; border-radius: 10px; box-shadow: 0 3px 0 var(--primary-hover); }
            button:active, .file-upload-btn:active { transform: translateY(3px); }
            select { font-size: 12px; padding: 6px 2px; border-radius: 10px; box-shadow: 0 3px 0 #e5e7eb; }
            .top-layout { gap: 8px; padding: 10px; }
            .left-controls { gap: 6px; }
            .control-row { gap: 6px; }
            .preview-placeholder { font-size: 12px; }
        }

        #game-area {
            flex-grow: 1; position: relative; width: 100%;
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden;
        }

        #game-board {
            position: relative;
            background-color: rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            border: 2px dashed #9ca3af; 
            border-radius: 8px;
        }

        #watermark {
            position: absolute; top: 0; left: 0;
            opacity: 0.15; pointer-events: none; border-radius: 8px;
        }

        #pieces-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .puzzle-piece {
            position: absolute; cursor: grab;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transition: filter 0.1s; pointer-events: auto;
        }

        .puzzle-piece.dragging {
            cursor: grabbing;
            filter: drop-shadow(5px 10px 15px rgba(0,0,0,0.5)) brightness(1.1);
        }

        .flash { animation: flashAnim 0.3s ease-out; }
        @keyframes flashAnim {
            0% { filter: brightness(1) drop-shadow(0 0 0 rgba(79, 70, 229, 0)); }
            50% { filter: brightness(1.3) drop-shadow(0 0 15px rgba(79, 70, 229, 0.8)); }
            100% { filter: brightness(1) drop-shadow(2px 4px 6px rgba(0,0,0,0.3)); }
        }

        .locked {
            filter: none !important;
            pointer-events: none !important;
            z-index: 1 !important;
        }

        #confetti-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
        }

        #message-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #message-modal.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-width: 80%; }
        .modal-text { font-size: 18px; color: var(--text); margin-bottom: 20px; font-weight: 600; white-space: pre-line; }
        .modal-close-btn { background-color: var(--primary); }
    </style>
    </head>
    <body>

        <div id="top-section">
            <div class="top-layout">
                <div class="left-controls">
                    <div class="control-row">
                        <label class="file-upload-wrapper">
                            <div class="file-upload-btn">
                                <span class="btn-icon">🖼️</span>
                                <span class="btn-text">사진 선택</span>
                            </div>
                            <input type="file" id="image-upload"
                                accept="image/*">
                        </label>
                        <button id="toggle-guide">
                            <span class="btn-icon" id="guide-icon">💡</span>
                            <span class="btn-text" id="guide-text">가이드
                                OFF</span>
                        </button>
                    </div>

                    <div class="control-row">
                        <button id="gather-btn">
                            <span class="btn-icon">🧲</span>
                            <span class="btn-text">조각 모으기</span>
                        </button>
                        <button id="start-btn"
                            style="background-color: #ef4444; box-shadow: 0 4px 0 #b91c1c;">
                            <span class="btn-icon">✨</span>
                            <span class="btn-text">퍼즐 섞기</span>
                        </button>
                    </div>

                    <div class="control-row">
                        <select id="difficulty">
                            <option value="2">🧩 4조각 (아기용)</option>
                            <option value="3" selected>🧩 9조각 (쉬움)</option>
                            <option value="4">🧩 16조각 (보통)</option>
                            <option value="5">🧩 25조각 (어려움)</option>
                            <option value="6">🧩 36조각 (매우 어려움)</option>
                        </select>
                    </div>
                </div>

                <div id="preview-container" class="right-preview">
                    <div class="preview-placeholder" id="preview-placeholder">미리
                        보기</div>
                    <img id="preview-img" src>
                </div>
            </div>

            <div id="status-bar-wrapper">
                <div id="status-bar">
                    ⏱ <span id="timer">00:00</span> &nbsp;|&nbsp; 🧩 <span
                        id="progress-text">0 / 0</span>
                </div>
            </div>
        </div>

        <div id="game-area">
            <div id="game-board" style="display: none;">
                <canvas id="watermark"></canvas>
            </div>
            <div id="pieces-container"></div>
        </div>

        <canvas id="confetti-canvas"></canvas>

        <div id="message-modal">
            <div class="modal-content">
                <div class="modal-text" id="modal-text">메시지</div>
                <button class="modal-close-btn" id="modal-close">
                    <span class="btn-icon">✅</span>
                    <span class="btn-text">확인</span>
                </button>
            </div>
        </div>

        <script>
        const imageUpload = document.getElementById('image-upload');
        const difficultySelect = document.getElementById('difficulty');
        const startBtn = document.getElementById('start-btn');
        const toggleGuideBtn = document.getElementById('toggle-guide');
        const gameArea = document.getElementById('game-area');
        const gameBoard = document.getElementById('game-board');
        const watermarkCanvas = document.getElementById('watermark');
        const piecesContainer = document.getElementById('pieces-container');
        const modal = document.getElementById('message-modal');
        const modalText = document.getElementById('modal-text');
        const modalCloseBtn = document.getElementById('modal-close');

        const statusBar = document.getElementById('status-bar');
        const timerEl = document.getElementById('timer');
        const progressTextEl = document.getElementById('progress-text');

        const gatherBtn = document.getElementById('gather-btn');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');
        const previewPlaceholder = document.getElementById('preview-placeholder');
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctxConfetti = confettiCanvas.getContext('2d');

        let img = new Image();
        let memCanvas = document.createElement('canvas'); 
        let pieces = [];
        let isGuideOn = true;
        let boardWidth, boardHeight;
        let pieceWidth, pieceHeight;
        let tabSize;
        let currentZIndex = 10;
        let lockedCount = 0;
        let pieceGroupIdCounter = 0;

        let isDragging = false;
        let startX = 0, startY = 0;
        let activeGroupElements = [];

        let timerInterval = null;
        let secondsElapsed = 0;

        function updateProgress() {
            progressTextEl.textContent = `${lockedCount} / ${pieces.length}`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            timerEl.textContent = "00:00";
            statusBar.style.display = 'block';
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const s = String(secondsElapsed % 60).padStart(2, '0');
                timerEl.textContent = `${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSnapSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playTadaSound() {
            if (!audioCtx) return;
            [440, 554.37, 659.25, 880].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }, i * 100);
            });
        }

        let particles = [];
        function startConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            particles = [];
            const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#4f46e5'];
            for(let i=0; i<100; i++) {
                particles.push({
                    x: confettiCanvas.width / 2,
                    y: confettiCanvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            requestAnimationFrame(renderConfetti);
        }
        
        function renderConfetti() {
            ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;
            particles.forEach(p => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.1;
                p.x += p.dx;
                p.y += p.dy;
                if (p.y <= confettiCanvas.height) active = true;
                
                ctxConfetti.beginPath();
                ctxConfetti.lineWidth = p.r;
                ctxConfetti.strokeStyle = p.color;
                ctxConfetti.moveTo(p.x + p.tilt + p.r, p.y);
                ctxConfetti.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctxConfetti.stroke();
            });
            if (active) requestAnimationFrame(renderConfetti);
            else ctxConfetti.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }

        function showMessage(text) { modalText.textContent = text; modal.classList.add('show'); }
        modalCloseBtn.addEventListener('click', () => modal.classList.remove('show'));

        let activeObjectURL = null;
        function revokeActiveURL() {
            if (activeObjectURL) {
                URL.revokeObjectURL(activeObjectURL);
                activeObjectURL = null;
            }
        }

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            revokeActiveURL();
            piecesContainer.innerHTML = '';
            
            previewPlaceholder.textContent = "불러오는 중...";
            previewPlaceholder.style.display = 'flex';
            previewImg.style.display = 'none';

            const onImageLoadSuccess = () => {
                gameBoard.style.display = 'block';
                previewImg.src = img.src;
                previewImg.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                
                initBoard();
            };

            activeObjectURL = URL.createObjectURL(file);
            img.onload = onImageLoadSuccess;

            img.onerror = () => {
                revokeActiveURL();
                const reader = new FileReader();
                reader.onload = (event) => {
                    img.onload = onImageLoadSuccess;
                    img.onerror = () => {
                        previewPlaceholder.textContent = "선택 실패";
                        showMessage("이미지 파일 해독에 실패했습니다.");
                    };
                    img.src = event.target.result;
                };
                reader.onerror = () => {
                    previewPlaceholder.textContent = "선택 실패";
                    showMessage("파일을 읽는 과정에서 오류가 발생했습니다.");
                };
                reader.readAsDataURL(file);
            };

            img.src = activeObjectURL;
        });

        window.addEventListener('resize', () => {
            if (img.src && pieces.length === 0) initBoard();
        });

        function initBoard() {
            const areaWidth = gameArea.clientWidth;
            const areaHeight = gameArea.clientHeight;
            
            const isMobile = window.innerWidth < 768;
            const scaleFactor = isMobile ? 0.8 : 0.55;
            
            const maxBoardWidth = areaWidth * scaleFactor;
            const maxBoardHeight = areaHeight * scaleFactor;
            
            const scale = Math.min(maxBoardWidth / img.width, maxBoardHeight / img.height);
            boardWidth = img.width * scale;
            boardHeight = img.height * scale;

            gameBoard.style.width = `${boardWidth}px`;
            gameBoard.style.height = `${boardHeight}px`;

            memCanvas.width = boardWidth; memCanvas.height = boardHeight;
            memCanvas.getContext('2d').drawImage(img, 0, 0, boardWidth, boardHeight);
            
            watermarkCanvas.width = boardWidth; watermarkCanvas.height = boardHeight;
            watermarkCanvas.getContext('2d').drawImage(memCanvas, 0, 0);
        }

        startBtn.addEventListener('click', () => {
            if (!img.src) { showMessage("먼저 사진을 불러와주세요."); return; }
            initAudio(); 
            piecesContainer.innerHTML = '';
            pieces = []; lockedCount = 0; pieceGroupIdCounter = 0;
            
            updateProgress();
            startTimer();
            initBoard();

            const grid = parseInt(difficultySelect.value);
            pieceWidth = boardWidth / grid;
            pieceHeight = boardHeight / grid;
            tabSize = Math.min(pieceWidth, pieceHeight) * 0.22; 

            generateJigsawPieces(grid);
        });

        function generateJigsawPieces(grid) {
            let shapes = [];
            for (let y = 0; y < grid; y++) {
                shapes[y] = [];
                for (let x = 0; x < grid; x++) {
                    shapes[y][x] = { top: 0, right: 0, bottom: 0, left: 0 };
                    if (y > 0) shapes[y][x].top = -shapes[y-1][x].bottom;
                    if (x > 0) shapes[y][x].left = -shapes[y][x-1].right;
                    if (x < grid - 1) shapes[y][x].right = Math.random() < 0.5 ? 1 : -1;
                    if (y < grid - 1) shapes[y][x].bottom = Math.random() < 0.5 ? 1 : -1;
                }
            }

            for (let y = 0; y < grid; y++) {
                for (let x = 0; x < grid; x++) {
                    createPieceCanvas(x, y, shapes[y][x]);
                }
            }
        }

        function drawJigsawPath(ctx, w, h, shape, t) {
            const { top, right, bottom, left } = shape;
            const cx = w/2, cy = h/2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            
            if (top === 0) ctx.lineTo(w, 0);
            else {
                ctx.lineTo(cx - t*0.8, 0);
                ctx.bezierCurveTo(cx - t, -t*0.6*top, cx - t*1.2, -t*top, cx, -t*top);
                ctx.bezierCurveTo(cx + t*1.2, -t*top, cx + t, -t*0.6*top, cx + t*0.8, 0);
                ctx.lineTo(w, 0);
            }
            if (right === 0) ctx.lineTo(w, h);
            else {
                ctx.lineTo(w, cy - t*0.8);
                ctx.bezierCurveTo(w + t*0.6*right, cy - t, w + t*right, cy - t*1.2, w + t*right, cy);
                ctx.bezierCurveTo(w + t*right, cy + t*1.2, w + t*0.6*right, cy + t, w, cy + t*0.8);
                ctx.lineTo(w, h);
            }
            if (bottom === 0) ctx.lineTo(0, h);
            else {
                ctx.lineTo(cx + t*0.8, h);
                ctx.bezierCurveTo(cx + t, h + t*0.6*bottom, cx + t*1.2, h + t*bottom, cx, h + t*bottom);
                ctx.bezierCurveTo(cx - t*1.2, h + t*bottom, cx - t, h + t*0.6*bottom, cx - t*0.8, h);
                ctx.lineTo(0, h);
            }
            if (left === 0) ctx.lineTo(0, 0);
            else {
                ctx.lineTo(0, cy + t*0.8);
                ctx.bezierCurveTo(-t*0.6*left, cy + t, -t*left, cy + t*1.2, -t*left, cy);
                ctx.bezierCurveTo(-t*left, cy - t*1.2, -t*0.6*left, cy - t, 0, cy - t*0.8);
                ctx.lineTo(0, 0);
            }
            ctx.closePath();
        }

        function createPieceCanvas(gridX, gridY, shape) {
            const canvas = document.createElement('canvas');
            const canvasWidth = pieceWidth + tabSize * 2;
            const canvasHeight = pieceHeight + tabSize * 2;
            canvas.width = canvasWidth; canvas.height = canvasHeight;
            canvas.className = 'puzzle-piece';
            
            canvas.dataset.id = `${gridX}-${gridY}`;
            canvas.dataset.groupId = pieceGroupIdCounter++; 
            
            const targetX = gridX * pieceWidth;
            const targetY = gridY * pieceHeight;
            canvas.dataset.targetX = targetX;
            canvas.dataset.targetY = targetY;

            const ctx = canvas.getContext('2d');
            
            ctx.translate(tabSize, tabSize);
            drawJigsawPath(ctx, pieceWidth, pieceHeight, shape, tabSize);
            ctx.clip();
            
            ctx.drawImage(memCanvas, 
                targetX - tabSize, targetY - tabSize, canvasWidth, canvasHeight, 
                -tabSize, -tabSize, canvasWidth, canvasHeight
            );
            
            ctx.lineWidth = 1;
            ctx.strokeStyle = "rgba(0,0,0,0.2)";
            ctx.stroke();

            const pos = getRandomPositionOutsideBoard(canvasWidth, canvasHeight);
            canvas.style.left = `${pos.x}px`;
            canvas.style.top = `${pos.y}px`;
            
            piecesContainer.appendChild(canvas);
            pieces.push(canvas);
            addDragEvents(canvas);
        }

        function getRandomPositionOutsideBoard(cWidth, cHeight) {
            const boardRect = gameBoard.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            
            const isMobile = window.innerWidth < 768;
            const margin = isMobile ? 5 : 20;
            
            const bLeft = boardRect.left - areaRect.left - margin;
            const bTop = boardRect.top - areaRect.top - margin;
            const bRight = bLeft + boardRect.width + margin*2;
            const bBottom = bTop + boardRect.height + margin*2;
            
            let x, y;
            let isOverlap = true;
            let maxAttempts = 200;

            while (isOverlap && maxAttempts > 0) {
                x = Math.max(5, Math.random() * (areaRect.width - cWidth - 10));
                y = Math.max(5, Math.random() * (areaRect.height - cHeight - 10));
                
                const rightX = x + cWidth;
                const bottomY = y + cHeight;
                
                if (rightX < bLeft || x > bRight || bottomY < bTop || y > bBottom) {
                    isOverlap = false; 
                }
                maxAttempts--;
            }
            return { x, y };
        }

        gatherBtn.addEventListener('click', () => {
            if (pieces.length === 0) return;
            const areaRect = gameArea.getBoundingClientRect();
            
            const groups = {};
            pieces.forEach(p => {
                if (!p.classList.contains('locked')) {
                    const gid = p.dataset.groupId;
                    if (!groups[gid]) groups[gid] = [];
                    groups[gid].push(p);
                }
            });

            Object.values(groups).forEach(groupPieces => {
                const basePiece = groupPieces[0];
                const currentLeft = parseFloat(basePiece.style.left);
                const currentTop = parseFloat(basePiece.style.top);

                const randomX = Math.random() * (areaRect.width * 0.8);
                const randomY = Math.random() * (areaRect.height * 0.2);

                const dx = randomX - currentLeft;
                const dy = randomY - currentTop;

                groupPieces.forEach(p => {
                    const newLeft = parseFloat(p.style.left) + dx;
                    const newTop = parseFloat(p.style.top) + dy;
                    p.style.left = `${newLeft}px`;
                    p.style.top = `${newTop}px`;
                    
                    p.classList.add('flash');
                    setTimeout(() => p.classList.remove('flash'), 300);
                });
            });
        });

        toggleGuideBtn.addEventListener('click', () => {
            isGuideOn = !isGuideOn;
            watermarkCanvas.style.display = isGuideOn ? 'block' : 'none';
            
            const guideText = document.getElementById('guide-text');
            const guideIcon = document.getElementById('guide-icon');
            
            guideText.textContent = isGuideOn ? '가이드 OFF' : '가이드 ON';
            guideIcon.textContent = isGuideOn ? '💡' : '💤';
            
            toggleGuideBtn.style.backgroundColor = isGuideOn ? 'var(--primary)' : '#6b7280';
            toggleGuideBtn.style.boxShadow = isGuideOn ? '0 4px 0 var(--primary-hover)' : '0 4px 0 #4b5563';
        });

        function addDragEvents(piece) {
            piece.addEventListener('mousedown', dragStart);
            piece.addEventListener('touchstart', dragStart, { passive: false });
        }

        function dragStart(e) {
            if (e.target.classList.contains('locked')) return;
            e.preventDefault(); 
            isDragging = true;
            
            const groupId = e.target.dataset.groupId;
            activeGroupElements = pieces.filter(p => p.dataset.groupId === groupId && !p.classList.contains('locked'));

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            startX = clientX; startY = clientY;
            currentZIndex++;

            activeGroupElements.forEach(p => {
                p.style.zIndex = currentZIndex;
                p.dataset.initLeft = parseFloat(p.style.left);
                p.dataset.initTop = parseFloat(p.style.top);
                p.classList.add('dragging');
            });

            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchend', dragEnd);
        }

        function dragMove(e) {
            if (!isDragging) return;
            e.preventDefault();

            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const dx = clientX - startX;
            const dy = clientY - startY;

            activeGroupElements.forEach(p => {
                let newLeft = parseFloat(p.dataset.initLeft) + dx;
                let newTop = parseFloat(p.dataset.initTop) + dy;
                
                const maxLeft = gameArea.clientWidth - 50; 
                const maxTop = gameArea.clientHeight - 50;
                newLeft = Math.max(-p.clientWidth + 50, Math.min(newLeft, maxLeft));
                newTop = Math.max(-p.clientHeight + 50, Math.min(newTop, maxTop));

                p.style.left = `${newLeft}px`;
                p.style.top = `${newTop}px`;
            });
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            activeGroupElements.forEach(p => p.classList.remove('dragging'));

            const threshold = 30; 
            let snappedToBoard = false;

            const baseP = activeGroupElements[0];
            const baseCurX = parseFloat(baseP.style.left);
            const baseCurY = parseFloat(baseP.style.top);
            const baseTargetX = parseFloat(baseP.dataset.targetX) - tabSize; 
            const baseTargetY = parseFloat(baseP.dataset.targetY) - tabSize;

            const boardRect = gameBoard.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            const boardOriginX = boardRect.left - areaRect.left;
            const boardOriginY = boardRect.top - areaRect.top;

            const absoluteTargetX = boardOriginX + baseTargetX;
            const absoluteTargetY = boardOriginY + baseTargetY;

            // 1. 보드 스냅 체크
            if (Math.abs(baseCurX - absoluteTargetX) < threshold && Math.abs(baseCurY - absoluteTargetY) < threshold) {
                const alignDx = absoluteTargetX - baseCurX;
                const alignDy = absoluteTargetY - baseCurY;
                
                activeGroupElements.forEach(p => {
                    p.style.left = `${parseFloat(p.style.left) + alignDx}px`;
                    p.style.top = `${parseFloat(p.style.top) + alignDy}px`;
                    p.classList.add('locked');
                    lockedCount++;
                });
                snappedToBoard = true;
                playSnapSound(); 
                updateProgress(); 
            }

            // 2. 외부 조각 스냅 (그룹 간 결합 체크)
            if (!snappedToBoard) {
                let merged = false;

                for (let activeP of activeGroupElements) {
                    const aCurX = parseFloat(activeP.style.left);
                    const aCurY = parseFloat(activeP.style.top);
                    const aTarX = parseFloat(activeP.dataset.targetX);
                    const aTarY = parseFloat(activeP.dataset.targetY);
                    
                    // 8차 패치: 현재 드래그 중인 조각의 Grid 좌표 추출
                    const [aGridX, aGridY] = activeP.dataset.id.split('-').map(Number);

                    for (let otherP of pieces) {
                        if (otherP.classList.contains('locked') || otherP.dataset.groupId === activeP.dataset.groupId) continue;

                        // 8차 패치: 대상 조각의 Grid 좌표 추출
                        const [oGridX, oGridY] = otherP.dataset.id.split('-').map(Number);

                        // 8차 패치: 오직 "상하좌우로 인접한(Neighbor)" 조각인지 엄격하게 검사
                        const isAdjacent = (Math.abs(aGridX - oGridX) === 1 && aGridY === oGridY) || 
                                           (Math.abs(aGridY - oGridY) === 1 && aGridX === oGridX);

                        // 원래 인접한 조각이 아니라면 거리차를 검사하지 않고 무시
                        if (!isAdjacent) continue;

                        const oCurX = parseFloat(otherP.style.left);
                        const oCurY = parseFloat(otherP.style.top);
                        const oTarX = parseFloat(otherP.dataset.targetX);
                        const oTarY = parseFloat(otherP.dataset.targetY);

                        const targetDiffX = aTarX - oTarX;
                        const targetDiffY = aTarY - oTarY;
                        const curDiffX = aCurX - oCurX;
                        const curDiffY = aCurY - oCurY;

                        if (Math.abs(targetDiffX - curDiffX) < threshold && Math.abs(targetDiffY - curDiffY) < threshold) {
                            const fixDx = targetDiffX - curDiffX;
                            const fixDy = targetDiffY - curDiffY;
                            const newGroupId = otherP.dataset.groupId;

                            activeGroupElements.forEach(p => {
                                p.style.left = `${parseFloat(p.style.left) + fixDx}px`;
                                p.style.top = `${parseFloat(p.style.top) + fixDy}px`;
                                p.dataset.groupId = newGroupId; 
                                
                                p.classList.add('flash');
                                setTimeout(() => p.classList.remove('flash'), 300);
                            });
                            merged = true;
                            playSnapSound(); 
                            break;
                        }
                    }
                    if (merged) break; 
                }
            }

            if (lockedCount === pieces.length && pieces.length > 0) {
                stopTimer(); 
                playTadaSound(); 
                startConfetti(); 
                
                const timeString = timerEl.textContent;
                setTimeout(() => showMessage(`🎉 완벽해요! 🎉\n소요 시간: ${timeString}\n다른 난이도로 다시 도전해보세요!`), 300);
            }

            activeGroupElements = [];
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchend', dragEnd);
        }
    </script>
    </body>
